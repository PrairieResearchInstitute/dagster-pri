[project]
name = "dagster_pri"
requires-python = ">=3.12,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.11",
    "dagster-postgres==0.29.11",
    "cdsapi>=0.7.4",
    "xarray>=2024.6",
    "rioxarray>=0.15",
    "geopandas>=0.14",
    "pyogrio",
    "zarr>=3",
    "icechunk>=2.0",
    "s3fs>=2024.6",
    "numcodecs",
    "netcdf4",
    "dask",
    "pandas",
    "python-dotenv",
    "bottleneck",  # xarray ffill over the ERA5T expver-overlap dimension
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_pri"
registry_modules = [
    "dagster_pri.components.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
